server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side routes (e.g. /applications/:id) don't
  # exist as files, so unmatched paths resolve to index.html and
  # React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
