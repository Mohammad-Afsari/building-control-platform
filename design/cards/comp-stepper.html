<!-- @dsCard group="Components" viewport="700x130" name="Stepper" subtitle="Multi-step progress: done, current, upcoming" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:24px 30px; }
</style></head>
<body>
  <div class="bc-stepper">
    <div class="bc-step bc-step--done"><div class="bc-step-dot"><i data-lucide="check"></i></div><div class="bc-step-label">Your details</div></div>
    <div class="bc-step bc-step--done"><div class="bc-step-dot"><i data-lucide="check"></i></div><div class="bc-step-label">The work</div></div>
    <div class="bc-step bc-step--current"><div class="bc-step-dot">3</div><div class="bc-step-label">Upload plans</div></div>
    <div class="bc-step"><div class="bc-step-dot">4</div><div class="bc-step-label">Pay &amp; submit</div></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
