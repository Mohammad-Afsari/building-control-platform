<!-- @dsCard group="Components" viewport="700x110" name="Status pills" subtitle="One pill per application status" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:24px 22px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
</style></head>
<body>
  <div class="row">
    <span class="bc-pill bc-pill--draft"><span class="bc-dot"></span> Draft</span>
    <span class="bc-pill bc-pill--submitted"><span class="bc-dot"></span> Submitted</span>
    <span class="bc-pill bc-pill--review"><span class="bc-dot"></span> Under review</span>
    <span class="bc-pill bc-pill--approved"><span class="bc-dot"></span> Approved</span>
    <span class="bc-pill bc-pill--rejected"><span class="bc-dot"></span> Changes requested</span>
  </div>
</body></html>
