<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:22px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px 22px; }
</style></head>
<body>
  <div class="grid">
    <div class="bc-field">
      <label class="bc-label">Project address</label>
      <input class="bc-input" type="text" value="8 Maple Court" />
    </div>
    <div class="bc-field">
      <label class="bc-label">Estimated cost</label>
      <input class="bc-input is-error" type="text" value="abc" />
      <span class="bc-error-msg"><i data-lucide="alert-circle"></i> Please enter a number.</span>
    </div>
    <div class="bc-field">
      <label class="bc-label">Type of work</label>
      <div class="bc-select-wrap">
        <select class="bc-select"><option>Single-storey rear extension</option></select>
        <i data-lucide="chevron-down"></i>
      </div>
    </div>
    <button class="bc-file">
      <span class="bc-file-icon"><i data-lucide="upload-cloud"></i></span>
      <span><span class="bc-file-main">Upload drawings</span><span class="bc-file-sub">PDF, PNG or JPG · up to 25MB</span></span>
    </button>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
