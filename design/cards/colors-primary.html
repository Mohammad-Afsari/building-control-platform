<!-- @dsCard group="Colors" viewport="700x150" name="Primary — brand green" subtitle="The single trustworthy green that carries the brand" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:20px; }
  .row { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .sw { border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-default); background:var(--surface-card); }
  .sw .c { height:64px; }
  .sw .t { padding:8px 9px; }
  .sw .n { font-size:12px; font-weight:700; color:var(--text-heading); }
  .sw .h { font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); margin-top:2px; text-transform:uppercase; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="c" style="background:var(--primary-50)"></div><div class="t"><div class="n">50</div><div class="h">#EAF3EE</div></div></div>
    <div class="sw"><div class="c" style="background:var(--primary-100)"></div><div class="t"><div class="n">100</div><div class="h">#D3E7DC</div></div></div>
    <div class="sw"><div class="c" style="background:var(--primary-300)"></div><div class="t"><div class="n">300</div><div class="h">#76B295</div></div></div>
    <div class="sw"><div class="c" style="background:var(--primary-600)"></div><div class="t"><div class="n">600 · core</div><div class="h">#16795A</div></div></div>
    <div class="sw"><div class="c" style="background:var(--primary-700)"></div><div class="t"><div class="n">700 · hover</div><div class="h">#0F5C44</div></div></div>
    <div class="sw"><div class="c" style="background:var(--primary-800)"></div><div class="t"><div class="n">800 · press</div><div class="h">#0B4634</div></div></div>
  </div>
</body></html>
