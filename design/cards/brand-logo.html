<!-- @dsCard group="Brand" viewport="700x180" name="Logo" subtitle="The building-and-leaf mark, lockup, and reversed" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:24px; }
  .row { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  img { display:block; }
  .lockup { display:flex; align-items:center; gap:12px; }
  .wm { font-size:22px; letter-spacing:-0.022em; white-space:nowrap; }
  .wm b { font-weight:800; color:var(--text-heading); }
  .wm i { font-style:normal; font-weight:600; color:var(--text-muted); }
  .tile { display:flex; align-items:center; gap:11px; padding:14px 16px; border-radius:var(--radius-md);
    background:linear-gradient(155deg,var(--primary-600),var(--primary-800)); }
  .tile .wm b { color:#fff; } .tile .wm i { color:rgba(255,255,255,.72); }
  .sizes { display:flex; align-items:flex-end; gap:16px; }
</style></head>
<body>
  <div class="row">
    <div class="lockup">
      <img src="../assets/logo/building-control-logo.svg" alt="Building Control" width="48" height="48" />
      <span class="wm"><b>Building</b>&hairsp;<i>Control</i></span>
    </div>
    <div class="tile">
      <img src="../assets/logo/building-control-logo.svg" alt="Building Control" width="30" height="30" />
      <span class="wm"><b>Building</b>&hairsp;<i>Control</i></span>
    </div>
    <div class="sizes">
      <img src="../assets/logo/building-control-logo.svg" alt="" width="40" height="40" />
      <img src="../assets/logo/building-control-logo.svg" alt="" width="28" height="28" />
      <img src="../assets/logo/building-control-logo.svg" alt="" width="20" height="20" />
    </div>
  </div>
</body></html>
