<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base — space-1 through space-16" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--surface-page); padding:18px 22px; }
  .r { display:grid; grid-template-columns:80px 50px 1fr; gap:14px; align-items:center; padding:3px 0; }
  .tk { font-family:var(--font-mono); font-size:12px; color:var(--text-body); font-weight:600; }
  .px { font-family:var(--font-mono); font-size:12px; color:var(--text-faint); }
  .bar { height:16px; background:var(--primary-200); border:1px solid var(--primary-300); border-radius:4px; }
</style></head>
<body>
  <div class="r"><span class="tk">space-1</span><span class="px">4px</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="tk">space-2</span><span class="px">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="tk">space-3</span><span class="px">12px</span><div class="bar" style="width:12px"></div></div>
  <div class="r"><span class="tk">space-4</span><span class="px">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="tk">space-6</span><span class="px">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="tk">space-8</span><span class="px">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="tk">space-12</span><span class="px">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="r"><span class="tk">space-16</span><span class="px">64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
