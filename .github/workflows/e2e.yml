name: E2E

# Slower than the unit suite (it boots a real Postgres, GoTrue and
# mail server), so it runs only when something it can actually catch
# has changed — plus on demand.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'supabase/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The CLI is a devDependency, so no separate setup action is
      # needed. This applies supabase/migrations/ to a fresh database.
      - name: Start local Supabase
        run: npx supabase start

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts reads the API URL and anon key from
      # `supabase status`, then builds the app with them baked in.
      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Supabase logs on failure
        if: failure()
        run: npx supabase status || true
